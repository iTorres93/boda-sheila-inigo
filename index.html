<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Boda de Sheila & Iñigo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      background: #fdf6f0;
      color: #333;
      text-align: center;
    }

    header {
      background: #fde9e0;
      padding: 3em 1em;
    }

    .header-img {
      width: 120px;
      margin-bottom: 1em;
    }

    h1 {
      font-size: 2.8em;
      margin: 0;
      color: #a95b5b;
    }

    p.subtitle {
      font-size: 1.2em;
      color: #555;
      margin-top: 0.5em;
    }

    #countdown {
      font-size: 1.5em;
      margin-top: 1em;
      color: #444;
    }

    .section {
      padding: 3em 1em;
    }

    .section h2 {
      color: #a95b5b;
      font-size: 2em;
    }

    .info {
      margin: 1em 0;
      font-size: 1.2em;
    }

    .penguins {
      max-width: 300px;
      margin: 2em auto;
    }

    .btn {
      display: inline-block;
      background-color: #f6b3b3;
      color: white;
      padding: 1em 2em;
      font-size: 1.2em;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.3s;
      margin-top: 2em;
    }

    .btn:hover {
      background-color: #e59494;
    }

    .photo-banner {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
    }

    footer {
      padding: 2em 1em;
      background: #fde9e0;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Foto principal -->
  <img src="https://images.unsplash.com/photo-1529257414771-1960dba2b7a1?fit=crop&w=1500&q=80" alt="Foto pareja" class="photo-banner" />

  <header>
    <img src="https://www.svgrepo.com/show/428833/penguin-love.svg" alt="Pingüinos enamorados" class="header-img"/>
    <h1>Sheila & Iñigo</h1>
    <p class="subtitle">¡Nos casamos! 11 de octubre de 2025</p>
    <div id="countdown"></div>
  </header>

  <!-- Información del evento -->
  <section class="section">
    <h2>El Gran Día</h2>
    <p class="info">📍 Monasterio del Espino, Burgos</p>
    <p class="info">🕔 17:00 horas</p>
    <img src="https://www.svgrepo.com/show/424204/penguin-couple.svg" alt="Pingüinos tiernos" class="penguins" />
    <a href="https://docs.google.com/forms/d/e/1FAIpQLSe5_SArXTmJkFdNud1HQ4udxOumduzciO6NwJ3MlkBPxK3-Ow/viewform?usp=header" class="btn" target="_blank">Confirmar asistencia</a>
  </section>

  <footer>
    Hecho con 💗 por Sheila & Iñigo – 2025
  </footer>

  <!-- Script: Contador regresivo -->
  <script>
    function countdown() {
      const eventDate = new Date("2025-10-11T17:00:00");
      const now = new Date();
      const diff = eventDate - now;

      if (diff <= 0) {
        document.getElementById("countdown").textContent = "¡Ya estamos celebrando!";
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / (1000 * 60)) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById("countdown").textContent =
        `${days} días ${hours}h ${minutes}m ${seconds}s`;
    }

    setInterval(countdown, 1000);
    countdown();
  </script>
</body>
</html>
