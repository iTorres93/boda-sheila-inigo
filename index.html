<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boda Sheila & Iñigo</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #fdfdfd;
      --color-accent: #d08c60;
      --color-text: #333;
      --color-button: #f4c2c2;
      --color-button-hover: #f29292;
    }

    body {
      margin: 0;
      font-family: 'Quicksand', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text);
      text-align: center;
    }

    header {
      padding: 2em 1em;
    }

    header h1 {
      font-size: 2.5em;
      margin: 0.5em 0;
      color: var(--color-accent);
    }

    section {
      padding: 2em 1em;
    }

    .info {
      background-color: #ffe8d9;
      padding: 2em;
      border-radius: 20px;
      margin: 1em auto;
      max-width: 600px;
    }

    .button {
      display: inline-block;
      padding: 1em 2em;
      margin-top: 2em;
      background-color: var(--color-button);
      color: #fff;
      border: none;
      border-radius: 30px;
      font-size: 1em;
      text-decoration: none;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: var(--color-button-hover);
    }
  </style>
</head>
<body>

  <header>
    <h1>Sheila & Iñigo</h1>
    <p>¡Nos casamos!</p>
  </header>

  <section class="info">
    <h2>Detalles del Evento</h2>
    <p><strong>Fecha:</strong> 11 de octubre de 2025</p>
    <p><strong>Hora:</strong> 18:00</p>
    <p><strong>Lugar:</strong> Monasterio del Espino, Burgos</p>
  </section>

  <section>
    <a class="button" href="https://docs.google.com/forms/d/e/1FAIpQLSe5_SArXTmJkFdNud1HQ4udxOumduzciO6NwJ3MlkBPxK3-Ow/viewform?usp=header" target="_blank">
      Confirmar asistencia
    </a>
  </section>

</body>
</html>
